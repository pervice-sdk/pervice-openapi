name: pervice_openapi
description: Generate ready-to-use Dart models and Pervice services from OpenAPI. no Freezed, no build_runner.
version: 1.0.0
publisher: ttankkeo112@gmail.com
repository: https://github.com/pervice-sdk/pervice-openapi
keywords:
  - dart
  - flutter
  - openapi
  - swagger
  - code-generation
  - api-client
  - dio
  - serialization

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  analyzer: ^14.4.0
  yaml: ^3.1.3
  dio: ^5.11.1
  pervice: ^1.0.0
  openapi_spec_plus: ^0.6.0
  recase: ^4.1.0
  path: ^1.9.1
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
